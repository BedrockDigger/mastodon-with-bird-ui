name: Build Mastodon with Bird UI

on:
  schedule:
    # Run every 6 hours to check for new upstream releases
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
      - master
    # The published image depends only on upstream Mastodon + Bird UI, so
    # doc/workflow edits must not trigger a multi-hour, multi-arch rebuild.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if tag already exists'
        required: false
        type: boolean
        default: false
      custom_tag:
        description: 'Build a specific Mastodon tag (e.g., v4.3.0)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

# A full multi-arch build takes longer than the 6h cron interval, so without
# this the scheduled runs stack up and publish the same image in parallel.
# Scheduled runs queue behind an in-flight build; pushes supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  REGISTRY: ghcr.io

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Least privilege: this job only reads the package manifest.
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
      should_build: ${{ steps.check-build.outputs.should_build }}
      image_name: ${{ steps.prep.outputs.image_name }}
    steps:
      - name: Prep Image Name
        id: prep
        run: |
          # GHCR rejects uppercase repository names, so normalise to lowercase.
          IMAGE_NAME="${REGISTRY}/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Get Target Tag
        id: get-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          set -euo pipefail

          if [ -n "${CUSTOM_TAG}" ]; then
            TAG="${CUSTOM_TAG}"
          else
            # Resolve the latest stable release of mastodon/mastodon.
            TAG="$(gh api repos/mastodon/mastodon/releases/latest --jq '.tag_name')"
          fi

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "::error::Could not determine the target Mastodon tag"
            exit 1
          fi

          # The tag is interpolated into docker commands later on, so reject
          # anything that is not a plain version-ish string.
          if [[ "${TAG}" == *[!A-Za-z0-9._-]* ]]; then
            echo "::error::Refusing to build suspicious tag: ${TAG}"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Mastodon version tag: ${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No docker/setup-buildx-action here on purpose: `imagetools` talks to
      # the registry directly and needs no builder, so the 4x/day scheduled
      # run skips ~20s of setup.
      - name: Check if build is needed
        id: check-build
        env:
          TAG: ${{ steps.get-tag.outputs.tag }}
          FORCE_BUILD: ${{ inputs.force_build }}
          IMAGE_NAME: ${{ steps.prep.outputs.image_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "${FORCE_BUILD}" = "true" ] || [ "${EVENT_NAME}" = "push" ]; then
            echo "Force build or push event detected. Proceeding to build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}" >/dev/null 2>&1; then
            echo "Image tag ${TAG} already exists in ${REGISTRY}. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image tag ${TAG} does not exist in ${REGISTRY}. Proceeding to build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    # Without an explicit cap a stuck build burns the 6h default on both runners.
    timeout-minutes: 240
    env:
      IMAGE_NAME: ${{ needs.check.outputs.image_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout Mastodon
        uses: actions/checkout@v6
        with:
          repository: mastodon/mastodon
          ref: ${{ needs.check.outputs.tag }}
          path: mastodon

      - name: Checkout Bird UI
        uses: actions/checkout@v6
        with:
          repository: rollecode/mastodon-bird-ui
          path: mastodon-bird-ui

      - name: Install Bird UI to Mastodon
        shell: bash
        run: |
          # Define and export a dummy chown function to prevent script failure on runner
          chown() { :; }
          export -f chown

          cd mastodon-bird-ui
          # Install Bird UI to Mastodon with all variations (-v) and set it as the default theme (-d)
          bash scripts/install-to-mastodon.sh --path ../mastodon -v -d

      - name: Add Bird UI locale entries to all locales
        shell: bash
        run: |
          # Define add_locale_entry function as defined in install-to-mastodon.sh
          add_locale_entry() {
            local file="$1"
            local key="$2"
            local value="$3"
            local lang="$4"

            [ ! -f "$file" ] && return

            if ! grep -q "^    ${key}:" "$file"; then
              if grep -q "^  themes:" "$file"; then
                sed -i "/^  themes:/a\\    ${key}: ${value}" "$file"
                echo -e "  Added to $lang: $key"
              fi
            fi
          }

          # Update all other locales besides en and fi
          for file in mastodon/config/locales/*.yml; do
            filename=$(basename "$file")
            # Only process main locale files (avoid files with dots in the name before .yml)
            if [[ "$filename" == *.*.yml ]]; then
              continue
            fi
            # Skip en.yml and fi.yml since they are handled by install-to-mastodon.sh
            if [[ "$filename" == "en.yml" || "$filename" == "fi.yml" ]]; then
              continue
            fi

            # Update default locale label to Mastodon Bird UI
            sed -i "s/^    default: Mastodon.*/    default: Mastodon Bird UI/" "$file"

            # Add other theme variants using add_locale_entry
            add_locale_entry "$file" "mastodon-dark" "Mastodon" "$filename"
            add_locale_entry "$file" "mastodon-bird-ui-accessible" "Mastodon Bird UI (Accessible)" "$filename"
            add_locale_entry "$file" "mastodon-bird-ui-accessible-plus" "Mastodon Bird UI (Accessible Plus)" "$filename"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push by Digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: mastodon
          file: mastodon/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch caches: layers are not portable between architectures.
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Export Digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_NAME: ${{ needs.check.outputs.image_name }}
    steps:
      - name: Download Digest Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Multi-Arch Manifest
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          cd /tmp/digests

          # Build the source list explicitly: a bare glob silently degrades to
          # the literal string "*" when nothing was downloaded.
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -eq 0 ]; then
            echo "::error::No platform digests were downloaded; refusing to publish an empty manifest."
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          echo "Publishing ${#sources[@]} platform(s) as ${IMAGE_NAME}:${TAG} and ${IMAGE_NAME}:latest"
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${TAG}" \
            -t "${IMAGE_NAME}:latest" \
            "${sources[@]}"
